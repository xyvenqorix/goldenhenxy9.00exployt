<html manifest="psfree_lapse.cache">
<head>
    <meta charset="utf-8">
    <title>GoldenHenxy9.000 by XYVENQORIX</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #0a0e0f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            padding: 20px;
        }
        .cache-card {
            background: #11181c;
            border: 1px solid #1e2a30;
            border-radius: 16px;
            padding: 44px 40px 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 30px rgba(0, 180, 255, 0.02);
            text-align: center;
        }
        .cache-title {
            color: #f5d98a;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .cache-title small {
            display: block;
            color: #5a8a9a;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 3px;
            margin-top: 4px;
        }
        .cache-title small strong {
            color: #f5d98a;
            font-weight: 700;
        }
        .cache-sub {
            color: #4a7a8a;
            font-size: 13px;
            letter-spacing: 1px;
            margin: 6px 0 28px;
        }
        .progress-wrap {
            background: #0d1418;
            border-radius: 40px;
            height: 14px;
            border: 1px solid #1e3238;
            overflow: hidden;
            margin-bottom: 12px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #0a4a5a, #f5d98a);
            border-radius: 40px;
            transition: width 0.25s ease;
            box-shadow: 0 0 20px rgba(245,217,138,0.10);
        }
        .progress-label {
            color: #7ab0c0;
            font-size: 15px;
            letter-spacing: 0.5px;
            margin: 6px 0 18px;
            min-height: 26px;
        }
        .cache-status {
            color: #4a7a8a;
            font-size: 13px;
            border-top: 1px solid #1a2a30;
            padding-top: 20px;
            margin-top: 8px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .cache-status span { color: #8ab8c8; }
        .cache-status .creator-badge {
            color: #f5d98a;
            font-weight: 700;
        }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #1a3a44;
            border-top-color: #f5d98a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .cache-done .spinner {
            border-color: #f5d98a;
            border-top-color: #1a3a44;
            animation: none;
        }
        .cache-done .progress-bar {
            background: linear-gradient(90deg, #2a8a5a, #5ade8a);
        }
        .footer-small {
            margin-top: 18px;
            color: #1a3a44;
            font-size: 11px;
            letter-spacing: 0.5px;
        }
        .footer-small .creator {
            color: #f5d98a;
            font-weight: 700;
        }
    </style>
    <script>
    history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);
    function DLProgress(e){
        var pct = Math.round(e.loaded / e.total * 100);
        if (pct > 100) pct = 100;
        document.getElementById('progressBar').style.width = pct + '%';
        document.getElementById('progressLabel').innerHTML = 'Installing Offline Cache ... ' + pct + '%';
    }
    function DisplayCacheProgress(){
        document.getElementById('progressBar').style.width = '100%';
        document.getElementById('progressLabel').innerHTML = '✓ Cache Installed Successfully';
        document.querySelector('.cache-card').classList.add('cache-done');
        setTimeout(function(){ location.reload(); }, 3000);
    }
    window.applicationCache.addEventListener("progress", DLProgress, false);
    window.applicationCache.oncached = function(e){ DisplayCacheProgress(); };
    window.applicationCache.onupdateready = function(e){ DisplayCacheProgress(); };
    </script>
</head>
<body>
    <div class="cache-card">
        <div class="cache-title">
            ⚡ GoldenHenxy9.000
            <small>by <strong>XYVENQORIX</strong></small>
        </div>
        <div class="cache-sub">offline cache · Lapse Kex 9.00</div>
        <div class="progress-wrap">
            <div class="progress-bar" id="progressBar" style="width:0%;"></div>
        </div>
        <div class="progress-label" id="progressLabel"></div>
        <div class="cache-status">
            <span>📦 PSFree</span>
            <span>🔹 v1.5.0b</span>
            <span class="creator-badge">🏆 XYVENQORIX</span>
        </div>
        <div class="footer-small">
            <span class="creator">XYVENQORIX</span>
        </div>
    </div>
</body>
</html>
