<html manifest="psfree_lapse.cache">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        GoldenHenxy9.000 by XYVENQORIX
    </title>


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        *,
        *::before,
        *::after {

            margin: 0;
            padding: 0;

            box-sizing: border-box;
        }


        /* =====================================================
           HTML
        ===================================================== */

        html {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;
        }


        /* =====================================================
           BODY
           CENTRADO FIJO
        ===================================================== */

        body {

            width: 100%;
            height: 100%;

            min-height: 100vh;
            min-height: 100dvh;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 20px;

            margin: 0;

            background:

                radial-gradient(
                    circle at 15% 10%,
                    rgba(28, 37, 56, 0.95) 0%,
                    transparent 35%
                ),

                radial-gradient(
                    circle at 85% 90%,
                    rgba(21, 29, 46, 0.95) 0%,
                    transparent 35%
                ),

                #0b0d12;

            color: #e5e7eb;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            overflow: hidden;

            position: fixed;

            inset: 0;
        }


        /* =====================================================
           TERMINAL
           CENTRADO ABSOLUTO Y ESTABLE
        ===================================================== */

        .cache-card {

            position: fixed;

            top: 50%;
            left: 50%;

            width: min(650px, calc(100vw - 40px));

            max-width: 650px;

            max-height:
                calc(100vh - 40px);

            max-height:
                calc(100dvh - 40px);

            transform:
                translate3d(-50%, -50%, 0);

            -webkit-transform:
                translate3d(-50%, -50%, 0);

            background:
                linear-gradient(
                    145deg,
                    #101014 0%,
                    #09090b 100%
                );

            border:
                1px solid #303036;

            border-radius:
                14px;

            overflow: hidden;

            box-shadow:

                0 30px 80px
                rgba(0, 0, 0, 0.65),

                0 0 0 1px
                rgba(255, 255, 255, 0.025),

                inset 0 1px 0
                rgba(255, 255, 255, 0.04);

            isolation: isolate;

            z-index: 10;

            opacity: 0;

            animation:
                terminalAppear
                0.45s
                ease-out
                forwards;
        }


        /* =====================================================
           BARRA SUPERIOR MACOS
        ===================================================== */

        .cache-card::before {

            content:
                "Terminal";

            position:
                absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 42px;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    180deg,
                    #2c2c30 0%,
                    #1e1e21 100%
                );

            color:
                #a7a7ad;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            font-size:
                12px;

            font-weight:
                500;

            border-bottom:
                1px solid #38383d;

            z-index:
                5;

            pointer-events:
                none;
        }


        /* =====================================================
           BOTONES MACOS
        ===================================================== */

        .cache-card::after {

            content:
                "";

            position:
                absolute;

            top:
                15px;

            left:
                14px;

            width:
                12px;

            height:
                12px;

            border-radius:
                50%;

            background:
                #ff5f57;

            box-shadow:

                20px 0 #febc2e,

                40px 0 #28c840;

            z-index:
                6;

            pointer-events:
                none;
        }


        /* =====================================================
           CONTENIDO
        ===================================================== */

        .cache-content {

            width:
                100%;

            padding:
                70px 35px 30px;

            text-align:
                center;

            max-height:
                calc(100vh - 40px);

            max-height:
                calc(100dvh - 40px);

            overflow-y:
                auto;

            overflow-x:
                hidden;

            scrollbar-width:
                thin;

            scrollbar-color:
                #38383d transparent;
        }


        /* =====================================================
           SCROLLBAR
        ===================================================== */

        .cache-content::-webkit-scrollbar {

            width:
                6px;
        }


        .cache-content::-webkit-scrollbar-track {

            background:
                transparent;
        }


        .cache-content::-webkit-scrollbar-thumb {

            background:
                #38383d;

            border-radius:
                10px;
        }


        /* =====================================================
           LINEA DE COMANDO
        ===================================================== */

        .terminal-line {

            width:
                100%;

            margin-bottom:
                15px;

            color:
                #8b949e;

            font-family:
                "SFMono-Regular",
                "SF Mono",
                Menlo,
                Monaco,
                Consolas,
                "Liberation Mono",
                monospace;

            font-size:
                12px;

            line-height:
                1.5;

            text-align:
                center;

            overflow-wrap:
                anywhere;
        }


        .terminal-line .prompt {

            color:
                #28c840;

            font-weight:
                700;
        }


        /* =====================================================
           TITULO
        ===================================================== */

        .cache-title {

            color:
                #f5d98a;

            font-family:
                "SFMono-Regular",
                "SF Mono",
                Menlo,
                Monaco,
                Consolas,
                "Liberation Mono",
                monospace;

            font-size:
                26px;

            font-weight:
                700;

            letter-spacing:
                0.5px;

            line-height:
                1.3;

            text-align:
                center;

            text-shadow:
                0 0 18px
                rgba(245, 217, 138, 0.10);

            overflow-wrap:
                anywhere;
        }


        /* =====================================================
           AUTOR
        ===================================================== */

        .cache-title small {

            display:
                block;

            margin-top:
                5px;

            color:
                #707782;

            font-size:
                12px;

            font-weight:
                400;

            letter-spacing:
                2px;
        }


        .cache-title small strong {

            color:
                #f5d98a;

            font-weight:
                700;
        }


        /* =====================================================
           SUBTITULO
        ===================================================== */

        .cache-sub {

            margin:
                8px 0 25px;

            color:
                #707782;

            font-family:
                "SFMono-Regular",
                "SF Mono",
                Menlo,
                Monaco,
                Consolas,
                "Liberation Mono",
                monospace;

            font-size:
                12px;

            letter-spacing:
                0.8px;

            text-align:
                center;
        }


        /* =====================================================
           BLOQUE DE ESTADO
        ===================================================== */

        .terminal-status {

            width:
                100%;

            margin:
                0 auto 18px;

            color:
                #72ff72;

            font-family:
                "SFMono-Regular",
                "SF Mono",
                Menlo,
                Monaco,
                Consolas,
                "Liberation Mono",
                monospace;

            font-size:
                12px;

            line-height:
                1.8;

            text-align:
                center;
        }


        .terminal-status .label {

            color:
                #8b949e;
        }


        /* =====================================================
           BARRA DE PROGRESO
        ===================================================== */

        .progress-wrap {

            width:
                100%;

            height:
                13px;

            background:
                #050506;

            border:
                1px solid #303036;

            border-radius:
                3px;

            overflow:
                hidden;

            margin:
                0 auto 12px;

            box-shadow:
                inset 0 2px 5px
                rgba(0, 0, 0, 0.7);
        }


        .progress-bar {

            width:
                0%;

            height:
                100%;

            background:
                linear-gradient(
                    90deg,
                    #15566a,
                    #31a7c8,
                    #f5d98a
                );

            border-radius:
                2px;

            transition:
                width 0.25s ease;

            box-shadow:
                0 0 15px
                rgba(245, 217, 138, 0.18);
        }


        /* =====================================================
           TEXTO PROGRESO
        ===================================================== */

        .progress-label {

            min-height:
                22px;

            margin:
                6px 0 18px;

            color:
                #72ff72;

            font-family:
                "SFMono-Regular",
                "SF Mono",
                Menlo,
                Monaco,
                Consolas,
                "Liberation Mono",
                monospace;

            font-size:
                13px;

            letter-spacing:
                0.2px;

            text-align:
                center;

            overflow-wrap:
                anywhere;
        }


        /* =====================================================
           INFORMACION
        ===================================================== */

        .cache-status {

            width:
                100%;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                12px 22px;

            flex-wrap:
                wrap;

            padding-top:
                15px;

            border-top:
                1px solid #25252a;

            color:
                #727780;

            font-family:
                "SFMono-Regular",
                "SF Mono",
                Menlo,
                Monaco,
                Consolas,
                "Liberation Mono",
                monospace;

            font-size:
                11px;

            text-align:
                center;
        }


        .cache-status span {

            color:
                #9298a1;
        }


        .cache-status .creator-badge {

            color:
                #f5d98a;

            font-weight:
                700;
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .footer-small {

            margin-top:
                18px;

            color:
                #444850;

            font-family:
                "SFMono-Regular",
                "SF Mono",
                Menlo,
                Monaco,
                Consolas,
                "Liberation Mono",
                monospace;

            font-size:
                10px;

            letter-spacing:
                0.5px;

            text-align:
                center;
        }


        .footer-small .creator {

            color:
                #f5d98a;

            font-weight:
                700;
        }


        /* =====================================================
           SPINNER
        ===================================================== */

        .spinner {

            display:
                inline-block;

            width:
                16px;

            height:
                16px;

            border:
                2px solid #27333a;

            border-top-color:
                #f5d98a;

            border-radius:
                50%;

            animation:
                spin
                0.8s
                linear
                infinite;

            vertical-align:
                middle;

            margin-right:
                8px;
        }


        @keyframes spin {

            to {

                transform:
                    rotate(360deg);
            }
        }


        /* =====================================================
           CACHE COMPLETADO
        ===================================================== */

        .cache-done .spinner {

            border-color:
                #f5d98a;

            border-top-color:
                #27333a;

            animation:
                none;
        }


        .cache-done .progress-bar {

            background:
                linear-gradient(
                    90deg,
                    #238b5a,
                    #43d982
                );

            box-shadow:
                0 0 15px
                rgba(67, 217, 130, 0.20);
        }


        .cache-done .progress-label {

            color:
                #43d982;
        }


        /* =====================================================
           ANIMACION
           IMPORTANTE:
           NO MODIFICA EL TRANSFORM DE LA TARJETA
        ===================================================== */

        @keyframes terminalAppear {

            from {

                opacity:
                    0;

            }

            to {

                opacity:
                    1;

            }
        }


        /* =====================================================
           SELECCION
        ===================================================== */

        ::selection {

            background:
                rgba(59, 130, 246, 0.35);

            color:
                #ffffff;
        }


        /* =====================================================
           MOVILES
        ===================================================== */

        @media (max-width: 700px) {

            body {

                padding:
                    12px;
            }


            .cache-card {

                width:
                    calc(100vw - 24px);

                max-width:
                    calc(100vw - 24px);

                max-height:
                    calc(100dvh - 24px);
            }


            .cache-content {

                padding:
                    68px 20px 25px;

                max-height:
                    calc(100dvh - 24px);
            }


            .cache-title {

                font-size:
                    22px;
            }


            .terminal-line {

                font-size:
                    11px;
            }


            .terminal-status {

                font-size:
                    11px;
            }


            .progress-label {

                font-size:
                    12px;
            }
        }


        /* =====================================================
           PANTALLAS MUY BAJAS
           ===================================================== */

        @media (max-height: 500px) {

            .cache-card {

                max-height:
                    calc(100dvh - 20px);
            }


            .cache-content {

                padding:
                    65px 20px 20px;

                max-height:
                    calc(100dvh - 20px);
            }


            .cache-sub {

                margin-bottom:
                    15px;
            }


            .terminal-status {

                line-height:
                    1.5;
            }


            .footer-small {

                margin-top:
                    12px;
            }
        }

    </style>


    <script>

        /* =====================================================
           HISTORIAL
           ===================================================== */

        try {

            history.replaceState(
                null,
                "",
                "index.html"
            );

        } catch (e) {

            console.log(
                "History API unavailable"
            );

        }


        /* =====================================================
           PROGRESO
        ===================================================== */

        function DLProgress(e) {

            var pct = 0;


            if (
                e &&
                e.total &&
                e.total > 0
            ) {

                pct =
                    Math.round(
                        (e.loaded / e.total) * 100
                    );

            }


            if (pct < 0) {

                pct = 0;
            }


            if (pct > 100) {

                pct = 100;
            }


            var progressBar =
                document.getElementById(
                    "progressBar"
                );


            var progressLabel =
                document.getElementById(
                    "progressLabel"
                );


            if (progressBar) {

                progressBar.style.width =
                    pct + "%";
            }


            if (progressLabel) {

                progressLabel.textContent =
                    "Installing Offline Cache ... "
                    + pct
                    + "%";
            }

        }


        /* =====================================================
           CACHE INSTALADO
        ===================================================== */

        function DisplayCacheProgress() {

            var progressBar =
                document.getElementById(
                    "progressBar"
                );


            var progressLabel =
                document.getElementById(
                    "progressLabel"
                );


            var card =
                document.querySelector(
                    ".cache-card"
                );


            if (progressBar) {

                progressBar.style.width =
                    "100%";
            }


            if (progressLabel) {

                progressLabel.textContent =
                    "✓ Cache Installed Successfully";
            }


            if (card) {

                card.classList.add(
                    "cache-done"
                );
            }


            /*
             * IMPORTANTE:
             *
             * La tarjeta utiliza:
             *
             * position: fixed
             * top: 50%
             * left: 50%
             * transform: translate3d(-50%, -50%, 0)
             *
             * La animación solamente modifica
             * opacity.
             *
             * Por eso la posición no cambia.
             */


            setTimeout(
                function() {

                    location.reload();

                },
                3000
            );

        }


        /* =====================================================
           APPLICATION CACHE
        ===================================================== */

        if (
            window.applicationCache
        ) {

            window
                .applicationCache
                .addEventListener(
                    "progress",
                    DLProgress,
                    false
                );


            window
                .applicationCache
                .addEventListener(
                    "cached",
                    function() {

                        DisplayCacheProgress();

                    },
                    false
                );


            window
                .applicationCache
                .addEventListener(
                    "updateready",
                    function() {

                        DisplayCacheProgress();

                    },
                    false
                );

        }

    </script>

</head>


<body>

        </div>


    </div>


</body>
